name: Radar Diario de Estagios em TI

on:
  schedule:
    # 06:00 em Aracaju/SE (America/Maceio, UTC-3, sem horário de verão)
    # 06:00 UTC-3 = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparo manual sob demanda pela interface do GitHub

concurrency:
  group: radar-estagios-daily
  cancel-in-progress: false

jobs:
  run-radar:
    name: Coletar e Notificar Vagas de Estágio
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necessário para persistir o banco jobs_history.db na branch data

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout do Código Principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Testes Automatizados
        run: python -m pytest tests/ -v --tb=short
        # Continua mesmo que os testes falhem para não bloquear as notificações
        continue-on-error: true

      - name: Baixar Histórico de Deduplicação (Branch data)
        run: |
          mkdir -p data
          if git ls-remote --heads origin data | grep -q data; then
            git fetch origin data:refs/remotes/origin/data || true
            git checkout origin/data -- data/jobs_history.db 2>/dev/null || echo "Histórico ainda não encontrado na branch data."
          else
            echo "Branch data ainda não existe. Um novo banco será inicializado na primeira execução."
          fi

      - name: Executar Radar de Estágios em TI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_TARGET_EMAIL: ${{ secrets.NOTIFICATION_TARGET_EMAIL || 'pauloitalo061@gmail.com' }}
        run: python main.py

      - name: Persistir Histórico de Deduplicação na Branch data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/jobs_history.db ]; then
            echo "Banco SQLite não encontrado. Nada a persistir."
            exit 0
          fi

          # Salva o banco na branch data de forma limpa
          DB_CONTENT=$(base64 -w 0 data/jobs_history.db)
          
          git fetch origin || true
          
          if git ls-remote --heads origin data | grep -q data; then
            git checkout origin/data -b data-branch
          else
            git checkout --orphan data-branch
            git rm -rf . --quiet || true
          fi

          mkdir -p data
          echo "$DB_CONTENT" | base64 -d > data/jobs_history.db
          git add data/jobs_history.db

          if git diff --staged --quiet; then
            echo "Nenhuma alteração no histórico de vagas. Nenhum commit necessário."
          else
            git commit -m "chore(data): atualiza historico de vagas notificadas [skip ci]"
            git push origin data-branch:data --force
          fi
          
          git checkout main || true

      - name: Alerta em Caso de Falha da Execução
        if: failure()
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_TARGET_EMAIL: ${{ secrets.NOTIFICATION_TARGET_EMAIL || 'pauloitalo061@gmail.com' }}
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, '.')
          from notifiers.email_notifier import EmailNotifier
          sender = os.getenv('GMAIL_SENDER_EMAIL', '')
          pwd = os.getenv('GMAIL_APP_PASSWORD', '')
          target = os.getenv('NOTIFICATION_TARGET_EMAIL', '')
          if sender and pwd and target:
              notifier = EmailNotifier(sender, pwd, target)
              notifier.send_error_alert('O workflow do GitHub Actions falhou durante a execução. Verifique os logs na aba Actions do repositório em github.com/Pauloisc/radar-estagios-ti/actions')
          EOF
